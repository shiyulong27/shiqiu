<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">地图转了，方向关系仍要看方向标</title><desc id="desc">左图北在纸上方，右图整图转半圈后北在纸下方；学校始终在公园北面。</desc><rect width="640" height="420" rx="18" fill="#faf6ed"/><g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" fill="#253f36" text-anchor="middle"><text x="320" y="43" font-size="27" >地图转了，方向关系仍要看方向标</text><circle cx="165" cy="200" r="95" fill="#e1ebe4"/><path d="M165 140 L165 260" stroke="#677b72" stroke-width="3" fill="none"/><path d="M105 200 L225 200" stroke="#677b72" stroke-width="3" fill="none"/><text x="165" y="110" font-size="24" >北 ↑</text><text x="165" y="305" font-size="24" >南</text><text x="55" y="207" font-size="22" >西</text><text x="275" y="207" font-size="22" >东</text><rect x="125" y="134" width="80" height="36" rx="12" fill="#dfb970"/><text x="165" y="160" font-size="20" >学校</text><rect x="125" y="230" width="80" height="36" rx="12" fill="#b1d0ba"/><text x="165" y="256" font-size="20" >公园</text><circle cx="475" cy="200" r="95" fill="#e1ebe4"/><path d="M475 140 L475 260" stroke="#677b72" stroke-width="3" fill="none"/><path d="M415 200 L535 200" stroke="#677b72" stroke-width="3" fill="none"/><text x="475" y="110" font-size="24" >南</text><text x="475" y="305" font-size="24" >北 ↓</text><text x="365" y="207" font-size="22" >东</text><text x="585" y="207" font-size="22" >西</text><rect x="435" y="230" width="80" height="36" rx="12" fill="#dfb970"/><text x="475" y="256" font-size="20" >学校</text><rect x="435" y="134" width="80" height="36" rx="12" fill="#b1d0ba"/><text x="475" y="160" font-size="20" >公园</text><text x="165" y="350" font-size="21" >北向朝上</text><text x="475" y="350" font-size="21" >整图转半圈</text><text x="320" y="395" font-size="19" >两幅图：学校都在公园北面</text></g></svg>
