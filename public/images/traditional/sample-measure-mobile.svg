<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 510" role="img" aria-labelledby="title desc"><title id="title">旧制：一斤分十六份</title><desc id="desc">十六份平均分两边，每边八份；旧制半斤等于八两。此图不表示固定克数。</desc><rect width="360" height="510" rx="18" fill="#faf6ed"/><g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" fill="#253f36" text-anchor="middle"><text x="180" y="40" font-size="20" >旧制：一斤分十六份</text><path d="M20 130 L340 130" stroke="#677b72" stroke-width="3" fill="none"/><path d="M180 130 L180 340" stroke="#677b72" stroke-width="3" fill="none"/><path d="M135 360 L225 360 L180 320 Z" fill="#677b72"/><rect x="15" y="170" width="31" height="31" rx="12" fill="#dfb970"/><rect x="55" y="170" width="31" height="31" rx="12" fill="#dfb970"/><rect x="95" y="170" width="31" height="31" rx="12" fill="#dfb970"/><rect x="135" y="170" width="31" height="31" rx="12" fill="#dfb970"/><rect x="15" y="210" width="31" height="31" rx="12" fill="#dfb970"/><rect x="55" y="210" width="31" height="31" rx="12" fill="#dfb970"/><rect x="95" y="210" width="31" height="31" rx="12" fill="#dfb970"/><rect x="135" y="210" width="31" height="31" rx="12" fill="#dfb970"/><rect x="195" y="170" width="31" height="31" rx="12" fill="#dfb970"/><rect x="235" y="170" width="31" height="31" rx="12" fill="#dfb970"/><rect x="275" y="170" width="31" height="31" rx="12" fill="#dfb970"/><rect x="315" y="170" width="31" height="31" rx="12" fill="#dfb970"/><rect x="195" y="210" width="31" height="31" rx="12" fill="#dfb970"/><rect x="235" y="210" width="31" height="31" rx="12" fill="#dfb970"/><rect x="275" y="210" width="31" height="31" rx="12" fill="#dfb970"/><rect x="315" y="210" width="31" height="31" rx="12" fill="#dfb970"/><text x="90" y="100" font-size="21" >半斤 = 八两</text><text x="270" y="100" font-size="21" >半斤 = 八两</text><text x="180" y="410" font-size="23" >两边各有八份</text><text x="180" y="455" font-size="20" >先知道制度，再理解换算</text></g></svg>
