<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">同一个春节，可以有不同过法</title><desc id="desc">春节的共同主题是辞旧迎新、团聚与祝福；具体活动由地方、社区和家庭而异。</desc><rect width="640" height="420" rx="18" fill="#faf6ed"/><g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" fill="#253f36" text-anchor="middle"><text x="320" y="43" font-size="27" >同一个春节，可以有不同过法</text><circle cx="320" cy="185" r="85" fill="#dfb970"/><text x="320" y="174" font-size="30" >团聚</text><text x="320" y="214" font-size="30" >祝福</text><rect x="35" y="90" width="150" height="65" rx="12" fill="#eee8d9"/><text x="110" y="132" font-size="21" >地方</text><rect x="455" y="90" width="150" height="65" rx="12" fill="#eee8d9"/><text x="530" y="132" font-size="21" >社区</text><rect x="35" y="260" width="150" height="65" rx="12" fill="#e1ebe4"/><text x="110" y="302" font-size="21" >家庭</text><rect x="455" y="260" width="150" height="65" rx="12" fill="#e1ebe4"/><text x="530" y="302" font-size="21" >时代变化</text><path d="M185 142 L245 170" stroke="#677b72" stroke-width="3" fill="none"/><path d="M455 142 L395 170" stroke="#677b72" stroke-width="3" fill="none"/><path d="M185 280 L250 230" stroke="#677b72" stroke-width="3" fill="none"/><path d="M455 280 L390 230" stroke="#677b72" stroke-width="3" fill="none"/><text x="320" y="385" font-size="20" >可以问：“你家怎样过年？有什么心愿？”</text></g></svg>
