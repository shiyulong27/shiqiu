<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 560" role="img" aria-labelledby="title desc"><title id="title">五行：古人的分类思想</title><desc id="desc">木火土金水是传统分类；这张图只列名称，不用于证明科学或医疗结论。</desc><rect width="360" height="560" rx="18" fill="#faf6ed"/><g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" fill="#253f36" text-anchor="middle"><text x="180" y="40" font-size="20" >五行：古人的分类思想</text><circle cx="180" cy="120" r="39" fill="#e1ebe4"/><text x="180" y="131" font-size="30" >木</text><circle cx="285" cy="215" r="39" fill="#e1ebe4"/><text x="285" y="226" font-size="30" >火</text><circle cx="245" cy="345" r="39" fill="#e1ebe4"/><text x="245" y="356" font-size="30" >土</text><circle cx="115" cy="345" r="39" fill="#e1ebe4"/><text x="115" y="356" font-size="30" >金</text><circle cx="75" cy="215" r="39" fill="#e1ebe4"/><text x="75" y="226" font-size="30" >水</text><text x="180" y="245" font-size="23" >传统观念</text><text x="180" y="455" font-size="22" >认识文化分类</text><text x="180" y="495" font-size="21" >不用它判断健康或命运</text></g></svg>
