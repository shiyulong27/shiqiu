<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 560" role="img" aria-labelledby="title desc"><title id="title">同一个春节，不同过法</title><desc id="desc">春节共同主题为辞旧迎新、团聚和祝福；地方社区家庭及时代会带来不同具体做法。</desc><rect width="360" height="560" rx="18" fill="#faf6ed"/><g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" fill="#253f36" text-anchor="middle"><text x="180" y="40" font-size="20" >同一个春节，不同过法</text><circle cx="180" cy="180" r="80" fill="#dfb970"/><text x="180" y="172" font-size="30" >团聚</text><text x="180" y="215" font-size="30" >祝福</text><rect x="20" y="300" width="150" height="65" rx="12" fill="#e1ebe4"/><text x="95" y="343" font-size="23" >地方</text><rect x="190" y="300" width="150" height="65" rx="12" fill="#e1ebe4"/><text x="265" y="343" font-size="23" >社区</text><rect x="20" y="385" width="150" height="65" rx="12" fill="#e1ebe4"/><text x="95" y="428" font-size="23" >家庭</text><rect x="190" y="385" width="150" height="65" rx="12" fill="#e1ebe4"/><text x="265" y="428" font-size="23" >时代变化</text><text x="180" y="505" font-size="21" >可以问：你家怎样过年？</text></g></svg>
