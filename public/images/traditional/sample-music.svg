<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">八音：按传统材料分乐器</title><desc id="desc">八类示例：金钟、石磬、土埙、革鼓、丝琴瑟、木柷敔、匏笙、竹笛箫。不是八个音符；现代材料可能变化。</desc><rect width="640" height="420" rx="18" fill="#faf6ed"/><g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" fill="#253f36" text-anchor="middle"><text x="320" y="43" font-size="27" >八音：按传统材料分乐器</text><rect x="30" y="85" width="145" height="115" rx="12" fill="#eee8d9"/><text x="102" y="127" font-size="29" >金</text><text x="102" y="170" font-size="23" >钟</text><rect x="185" y="85" width="145" height="115" rx="12" fill="#e1ebe4"/><text x="257" y="127" font-size="29" >石</text><text x="257" y="170" font-size="23" >磬</text><rect x="340" y="85" width="145" height="115" rx="12" fill="#eee8d9"/><text x="412" y="127" font-size="29" >土</text><text x="412" y="170" font-size="23" >埙</text><rect x="495" y="85" width="145" height="115" rx="12" fill="#e1ebe4"/><text x="567" y="127" font-size="29" >革</text><text x="567" y="170" font-size="23" >鼓</text><rect x="30" y="220" width="145" height="115" rx="12" fill="#eee8d9"/><text x="102" y="262" font-size="29" >丝</text><text x="102" y="305" font-size="23" >琴瑟</text><rect x="185" y="220" width="145" height="115" rx="12" fill="#e1ebe4"/><text x="257" y="262" font-size="29" >木</text><text x="257" y="305" font-size="23" >柷敔</text><rect x="340" y="220" width="145" height="115" rx="12" fill="#eee8d9"/><text x="412" y="262" font-size="29" >匏</text><text x="412" y="305" font-size="23" >笙</text><rect x="495" y="220" width="145" height="115" rx="12" fill="#e1ebe4"/><text x="567" y="262" font-size="29" >竹</text><text x="567" y="305" font-size="23" >笛箫</text><text x="320" y="395" font-size="18" >“匏”读 páo，指葫芦类材料；图中是传统分类示例</text></g></svg>
