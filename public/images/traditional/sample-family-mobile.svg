<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 510" role="img" aria-labelledby="title desc"><title id="title">找堂表：从“我”出发</title><desc id="desc">爸爸的兄弟的孩子常称堂亲；姑舅姨的孩子常称表亲。称呼还要看长幼和地区。</desc><rect width="360" height="510" rx="18" fill="#faf6ed"/><g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" fill="#253f36" text-anchor="middle"><text x="180" y="40" font-size="20" >找堂表：从“我”出发</text><rect x="130" y="75" width="100" height="50" rx="12" fill="#dfb970"/><text x="180" y="110" font-size="28" >我</text><path d="M180 125 L95 170" stroke="#677b72" stroke-width="3" fill="none"/><path d="M180 125 L265 170" stroke="#677b72" stroke-width="3" fill="none"/><rect x="20" y="170" width="150" height="100" rx="12" fill="#eee8d9"/><rect x="190" y="170" width="150" height="100" rx="12" fill="#eee8d9"/><text x="95" y="218" font-size="20" >爸爸的兄弟</text><text x="265" y="208" font-size="20" >姑姑、舅舅</text><text x="265" y="245" font-size="20" >或姨妈</text><path d="M95 270 L95 310" stroke="#677b72" stroke-width="3" fill="none"/><path d="M265 270 L265 310" stroke="#677b72" stroke-width="3" fill="none"/><rect x="20" y="310" width="150" height="100" rx="12" fill="#e1ebe4"/><rect x="190" y="310" width="150" height="100" rx="12" fill="#e1ebe4"/><text x="95" y="350" font-size="20" >他们的孩子</text><text x="95" y="385" font-size="22" >常称堂亲</text><text x="265" y="350" font-size="20" >他们的孩子</text><text x="265" y="385" font-size="22" >常称表亲</text><text x="180" y="465" font-size="20" >先看实际关系，不只看姓氏</text></g></svg>
