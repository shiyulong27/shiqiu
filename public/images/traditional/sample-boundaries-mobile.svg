<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 575" role="img" aria-labelledby="title desc"><title id="title">问好，也可以保持距离</title><desc id="desc">可以挥手问好，可以拒绝不愿意的拥抱，害怕时找可信成人。</desc><rect width="360" height="575" rx="18" fill="#faf6ed"/><g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" fill="#253f36" text-anchor="middle"><text x="180" y="40" font-size="20" >问好，也可以保持距离</text><circle cx="65" cy="120" r="30" fill="#dfb970"/><path d="M65 152 L65 195" stroke="#677b72" stroke-width="3" fill="none"/><path d="M65 170 L30 150" stroke="#677b72" stroke-width="3" fill="none"/><path d="M65 170 L100 140" stroke="#677b72" stroke-width="3" fill="none"/><text x="235" y="140" font-size="23" >挥挥手</text><circle cx="65" cy="265" r="30" fill="#b1d0ba"/><path d="M65 297 L65 340" stroke="#677b72" stroke-width="3" fill="none"/><path d="M65 315 L30 295" stroke="#677b72" stroke-width="3" fill="none"/><path d="M65 315 L100 285" stroke="#677b72" stroke-width="3" fill="none"/><text x="235" y="285" font-size="23" >我不想抱抱</text><circle cx="65" cy="410" r="30" fill="#c7d8e2"/><path d="M65 442 L65 485" stroke="#677b72" stroke-width="3" fill="none"/><path d="M65 460 L30 440" stroke="#677b72" stroke-width="3" fill="none"/><path d="M65 460 L100 430" stroke="#677b72" stroke-width="3" fill="none"/><text x="235" y="430" font-size="23" >找大人帮助</text><text x="180" y="530" font-size="21" >受到伤害，不是你的错</text></g></svg>
