<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 560" role="img" aria-labelledby="title desc"><title id="title">六亲：先看语境</title><desc id="desc">上框：泛指亲人。下框：具体文献中有不同的亲属分类，连同出处理解。</desc><rect width="360" height="560" rx="18" fill="#faf6ed"/><g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" fill="#253f36" text-anchor="middle"><text x="180" y="40" font-size="20" >六亲：先看语境</text><rect x="20" y="75" width="320" height="170" rx="12" fill="#eee8d9"/><text x="180" y="118" font-size="28" >泛指亲人</text><text x="180" y="170" font-size="22" >“亲”是在说关系</text><text x="180" y="210" font-size="22" >不必先数六个人</text><rect x="20" y="270" width="320" height="170" rx="12" fill="#e1ebe4"/><text x="180" y="315" font-size="28" >文献分类</text><text x="180" y="365" font-size="22" >有按关系分的名单</text><text x="180" y="405" font-size="22" >也有按亲属列的名单</text><text x="180" y="505" font-size="21" >连同出处和注释一起看</text></g></svg>
