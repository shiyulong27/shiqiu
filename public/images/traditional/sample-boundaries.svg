<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">问好有很多种方式</title><desc id="desc">可以挥手问好；不愿被拥抱时可以拒绝；害怕或不舒服时向可信成人求助。</desc><rect width="640" height="420" rx="18" fill="#faf6ed"/><g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" fill="#253f36" text-anchor="middle"><text x="320" y="43" font-size="27" >问好有很多种方式</text><circle cx="105" cy="150" r="31" fill="#dfb970"/><path d="M105 184 L105 240" stroke="#677b72" stroke-width="3" fill="none"/><path d="M105 208 L70 187" stroke="#677b72" stroke-width="3" fill="none"/><path d="M105 208 L140 175" stroke="#677b72" stroke-width="3" fill="none"/><text x="105" y="292" font-size="22" >挥挥手</text><circle cx="320" cy="150" r="31" fill="#b1d0ba"/><path d="M320 184 L320 240" stroke="#677b72" stroke-width="3" fill="none"/><path d="M320 208 L285 187" stroke="#677b72" stroke-width="3" fill="none"/><path d="M320 208 L355 175" stroke="#677b72" stroke-width="3" fill="none"/><text x="320" y="292" font-size="22" >我不想抱抱</text><circle cx="535" cy="150" r="31" fill="#c7d8e2"/><path d="M535 184 L535 240" stroke="#677b72" stroke-width="3" fill="none"/><path d="M535 208 L500 187" stroke="#677b72" stroke-width="3" fill="none"/><path d="M535 208 L570 175" stroke="#677b72" stroke-width="3" fill="none"/><text x="535" y="292" font-size="22" >找大人帮助</text><text x="320" y="365" font-size="20" >没有及时说“不”，受到伤害也不是你的错</text></g></svg>
