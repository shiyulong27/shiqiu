<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">五行：认识古人的分类思想</title><desc id="desc">木、火、土、金、水是传统五行分类。此图只列名称，不表示科学元素分类、医学结论或因果。</desc><rect width="640" height="420" rx="18" fill="#faf6ed"/><g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" fill="#253f36" text-anchor="middle"><text x="320" y="43" font-size="27" >五行：认识古人的分类思想</text><circle cx="320" cy="115" r="39" fill="#e1ebe4"/><text x="320" y="125" font-size="30" >木</text><circle cx="485" cy="205" r="39" fill="#e1ebe4"/><text x="485" y="215" font-size="30" >火</text><circle cx="425" cy="315" r="39" fill="#e1ebe4"/><text x="425" y="325" font-size="30" >土</text><circle cx="215" cy="315" r="39" fill="#e1ebe4"/><text x="215" y="325" font-size="30" >金</text><circle cx="155" cy="205" r="39" fill="#e1ebe4"/><text x="155" y="215" font-size="30" >水</text><text x="320" y="215" font-size="24" >传统观念</text><text x="320" y="395" font-size="20" >认识文化分类，不用它判断健康或命运</text></g></svg>
