<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">六亲：先看语境，再看名单</title><desc id="desc">泛指时指亲人；特定文献中可以按不同的六类亲属或关系列举。</desc><rect width="640" height="420" rx="18" fill="#faf6ed"/><g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" fill="#253f36" text-anchor="middle"><text x="320" y="43" font-size="27" >六亲：先看语境，再看名单</text><rect x="30" y="85" width="280" height="235" rx="12" fill="#eee8d9"/><rect x="330" y="85" width="280" height="235" rx="12" fill="#e1ebe4"/><text x="170" y="125" font-size="27" >泛指亲人</text><text x="170" y="180" font-size="21" >“亲”是在说关系</text><text x="170" y="225" font-size="21" >不必先数六个人</text><text x="470" y="125" font-size="27" >文献分类</text><text x="470" y="180" font-size="21" >有按关系分的名单</text><text x="470" y="225" font-size="21" >也有按亲属列的名单</text><text x="320" y="375" font-size="20" >读具体古文时，连同出处和注释一起看</text></g></svg>
