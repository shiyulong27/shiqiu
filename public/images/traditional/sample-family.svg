<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">找堂表：从“我”沿关系走</title><desc id="desc">爸爸的兄弟的孩子常称堂亲；姑姑、舅舅、姨妈的孩子常称表亲；不能只看姓氏。</desc><rect width="640" height="420" rx="18" fill="#faf6ed"/><g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" fill="#253f36" text-anchor="middle"><text x="320" y="43" font-size="27" >找堂表：从“我”沿关系走</text><rect x="265" y="78" width="110" height="48" rx="12" fill="#dfb970"/><text x="320" y="111" font-size="25" >我</text><path d="M320 126 L165 170" stroke="#677b72" stroke-width="3" fill="none"/><path d="M320 126 L475 170" stroke="#677b72" stroke-width="3" fill="none"/><rect x="45" y="170" width="240" height="58" rx="12" fill="#eee8d9"/><rect x="355" y="170" width="240" height="58" rx="12" fill="#eee8d9"/><text x="165" y="207" font-size="23" >爸爸 → 兄弟</text><text x="475" y="207" font-size="23" >父母 → 姑舅姨</text><path d="M165 228 L165 270" stroke="#677b72" stroke-width="3" fill="none"/><path d="M475 228 L475 270" stroke="#677b72" stroke-width="3" fill="none"/><rect x="45" y="270" width="240" height="60" rx="12" fill="#e1ebe4"/><rect x="355" y="270" width="240" height="60" rx="12" fill="#e1ebe4"/><text x="165" y="309" font-size="22" >他们的孩子：堂亲</text><text x="475" y="309" font-size="22" >他们的孩子：表亲</text><text x="320" y="385" font-size="19" >先看关系路径，再看长幼；各地称呼可能不同</text></g></svg>
