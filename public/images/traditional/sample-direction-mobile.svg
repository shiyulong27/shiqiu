<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 770" role="img" aria-labelledby="title desc"><title id="title">地图转了，先看方向标</title><desc id="desc">上图北向朝上，下图转半圈后北向朝下；学校始终在公园北面。</desc><rect width="360" height="770" rx="18" fill="#faf6ed"/><g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" fill="#253f36" text-anchor="middle"><text x="180" y="40" font-size="20" >地图转了，先看方向标</text><circle cx="180" cy="200" r="95" fill="#e1ebe4"/><path d="M180 140 L180 260" stroke="#677b72" stroke-width="3" fill="none"/><path d="M120 200 L240 200" stroke="#677b72" stroke-width="3" fill="none"/><text x="180" y="110" font-size="24" >北 ↑</text><text x="180" y="305" font-size="24" >南</text><text x="70" y="207" font-size="22" >西</text><text x="290" y="207" font-size="22" >东</text><rect x="140" y="134" width="80" height="36" rx="12" fill="#dfb970"/><text x="180" y="160" font-size="20" >学校</text><rect x="140" y="230" width="80" height="36" rx="12" fill="#b1d0ba"/><text x="180" y="256" font-size="20" >公园</text><text x="180" y="345" font-size="22" >北向朝上</text><g transform="translate(0 330)"><circle cx="180" cy="200" r="95" fill="#e1ebe4"/><path d="M180 140 L180 260" stroke="#677b72" stroke-width="3" fill="none"/><path d="M120 200 L240 200" stroke="#677b72" stroke-width="3" fill="none"/><text x="180" y="110" font-size="24" >南</text><text x="180" y="305" font-size="24" >北 ↓</text><text x="70" y="207" font-size="22" >东</text><text x="290" y="207" font-size="22" >西</text><rect x="140" y="230" width="80" height="36" rx="12" fill="#dfb970"/><text x="180" y="256" font-size="20" >学校</text><rect x="140" y="134" width="80" height="36" rx="12" fill="#b1d0ba"/><text x="180" y="160" font-size="20" >公园</text></g><text x="180" y="675" font-size="22" >整张图转半圈</text><text x="180" y="725" font-size="22" >学校始终在公园北面</text></g></svg>
