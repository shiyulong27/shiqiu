<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">先知道制度，才能读懂“半斤八两”</title><desc id="desc">采用旧制一斤十六两；十六份平均分两边，每边八份。积木只示意等份，不表示实际克数。</desc><rect width="640" height="420" rx="18" fill="#faf6ed"/><g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" fill="#253f36" text-anchor="middle"><text x="320" y="43" font-size="27" >先知道制度，才能读懂“半斤八两”</text><path d="M100 155 L540 155" stroke="#677b72" stroke-width="3" fill="none"/><path d="M320 155 L320 325" stroke="#677b72" stroke-width="3" fill="none"/><path d="M265 345 L375 345 L320 300 Z" fill="#677b72"/><rect x="115" y="190" width="31" height="31" rx="12" fill="#dfb970"/><rect x="155" y="190" width="31" height="31" rx="12" fill="#dfb970"/><rect x="195" y="190" width="31" height="31" rx="12" fill="#dfb970"/><rect x="235" y="190" width="31" height="31" rx="12" fill="#dfb970"/><rect x="115" y="230" width="31" height="31" rx="12" fill="#dfb970"/><rect x="155" y="230" width="31" height="31" rx="12" fill="#dfb970"/><rect x="195" y="230" width="31" height="31" rx="12" fill="#dfb970"/><rect x="235" y="230" width="31" height="31" rx="12" fill="#dfb970"/><rect x="385" y="190" width="31" height="31" rx="12" fill="#dfb970"/><rect x="425" y="190" width="31" height="31" rx="12" fill="#dfb970"/><rect x="465" y="190" width="31" height="31" rx="12" fill="#dfb970"/><rect x="505" y="190" width="31" height="31" rx="12" fill="#dfb970"/><rect x="385" y="230" width="31" height="31" rx="12" fill="#dfb970"/><rect x="425" y="230" width="31" height="31" rx="12" fill="#dfb970"/><rect x="465" y="230" width="31" height="31" rx="12" fill="#dfb970"/><rect x="505" y="230" width="31" height="31" rx="12" fill="#dfb970"/><text x="190" y="125" font-size="23" >半斤 = 八两</text><text x="460" y="125" font-size="23" >半斤 = 八两</text><text x="320" y="385" font-size="20" >旧制一斤分十六份；每一半都是八份</text></g></svg>
