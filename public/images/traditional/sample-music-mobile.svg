<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 645" role="img" aria-labelledby="title desc"><title id="title">八音：按材料分乐器</title><desc id="desc">金钟、石磬、土埙、革鼓、丝琴瑟、木柷敔、匏笙、竹笛箫是传统材料分类示例。</desc><rect width="360" height="645" rx="18" fill="#faf6ed"/><g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" fill="#253f36" text-anchor="middle"><text x="180" y="40" font-size="20" >八音：按材料分乐器</text><rect x="20" y="70" width="150" height="100" rx="12" fill="#eee8d9"/><text x="95" y="108" font-size="29" >金</text><text x="95" y="149" font-size="23" >钟</text><rect x="190" y="70" width="150" height="100" rx="12" fill="#e1ebe4"/><text x="265" y="108" font-size="29" >石</text><text x="265" y="149" font-size="23" >磬</text><rect x="20" y="185" width="150" height="100" rx="12" fill="#eee8d9"/><text x="95" y="223" font-size="29" >土</text><text x="95" y="264" font-size="23" >埙</text><rect x="190" y="185" width="150" height="100" rx="12" fill="#e1ebe4"/><text x="265" y="223" font-size="29" >革</text><text x="265" y="264" font-size="23" >鼓</text><rect x="20" y="300" width="150" height="100" rx="12" fill="#eee8d9"/><text x="95" y="338" font-size="29" >丝</text><text x="95" y="379" font-size="23" >琴瑟</text><rect x="190" y="300" width="150" height="100" rx="12" fill="#e1ebe4"/><text x="265" y="338" font-size="29" >木</text><text x="265" y="379" font-size="23" >柷敔</text><rect x="20" y="415" width="150" height="100" rx="12" fill="#eee8d9"/><text x="95" y="453" font-size="29" >匏</text><text x="95" y="494" font-size="23" >笙</text><rect x="190" y="415" width="150" height="100" rx="12" fill="#e1ebe4"/><text x="265" y="453" font-size="29" >竹</text><text x="265" y="494" font-size="23" >笛箫</text><text x="180" y="565" font-size="20" >“匏”读 páo，指葫芦类材料</text><text x="180" y="605" font-size="20" >图中是传统分类示例</text></g></svg>
