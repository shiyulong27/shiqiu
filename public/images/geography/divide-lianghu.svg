<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="lhBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="lakeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="lhShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.07"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="480" rx="16" fill="url(#lhBg)"/>
  <rect x="12" y="12" width="776" height="456" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- 顶部标题 -->
  <g transform="translate(30, 42)">
    <text font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#0369a1">
      🌊 洞庭云梦 · 两湖分野 —— 湖南与湖北地理人文溯源
    </text>
    <text y="22" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b">
      以洞庭湖为界 · 古云梦泽沧海桑田 · 湖广熟天下足 · 荆楚大地与潇湘水云
    </text>
  </g>

  <!-- 湖北卡片（湖之北） -->
  <g transform="translate(36, 85)" filter="url(#lhShadow)">
    <rect width="345" height="150" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
    <text x="18" y="28" font-size="16" font-weight="900" fill="#166534">湖北省 (洞庭湖以北 · 荆楚大地)</text>
    <text x="18" y="52" font-size="12" fill="#14532d">🏯 地标胜境：<tspan font-weight="bold">黄鹤楼</tspan>、三峡大坝、武当仙山、神农架</text>
    <text x="18" y="74" font-size="12" fill="#14532d">🌾 地貌水系：<tspan font-weight="bold">江汉平原</tspan>沃野，汉江注入长江，“千湖之省”</text>
    <text x="18" y="96" font-size="12" fill="#14532d">📜 省名溯源：清康熙三年分湖广为南北二路，湖北因在洞庭之北立省</text>
    <text x="18" y="118" font-size="12" fill="#14532d">🎭 文化图腾：楚国八百年故都纪南城 · 编钟楚乐 · 浪漫浪漫九歌</text>
    <text x="18" y="136" font-size="11.5" font-weight="bold" fill="#047857">💡 “昔人已乘黄鹤去，此地空余黄鹤楼”</text>
  </g>

  <!-- 湖南卡片（湖之南） -->
  <g transform="translate(419, 85)" filter="url(#lhShadow)">
    <rect width="345" height="150" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
    <text x="18" y="28" font-size="16" font-weight="900" fill="#1e40af">湖南省 (洞庭湖以南 · 湖湘福地)</text>
    <text x="18" y="52" font-size="12" fill="#1e3a8a">🏯 地标胜境：<tspan font-weight="bold">岳阳楼</tspan>、张家界、南岳衡山、橘子洲头</text>
    <text x="18" y="74" font-size="12" fill="#1e3a8a">🌊 地貌水系：<tspan font-weight="bold">洞庭湖</tspan>与湘、资、沅、澧四水汇长江，“芙蓉国度”</text>
    <text x="18" y="96" font-size="12" fill="#1e3a8a">📜 省名溯源：唐置湖南观察使，因居洞庭湖之南得名，简称“湘”</text>
    <text x="18" y="118" font-size="12" fill="#1e3a8a">⚔️ 文化图腾：心忧天下敢为人先 · 岳麓书院 · 屈原涉江涉澧</text>
    <text x="18" y="136" font-size="11.5" font-weight="bold" fill="#1d4ed8">💡 “先天下之忧而忧，后天下之乐而乐”</text>
  </g>

  <!-- 中央连结：八百里洞庭湖枢纽图示 -->
  <g transform="translate(36, 250)">
    <rect width="728" height="70" rx="10" fill="#0c4a6e"/>
    
    <!-- 洞庭湖水面示意 -->
    <path d="M 40 35 Q 180 15, 364 35 Q 540 55, 688 35" fill="none" stroke="url(#lakeGrad)" stroke-width="10" stroke-linecap="round"/>
    
    <text x="364" y="24" text-anchor="middle" font-size="14" font-weight="900" fill="#f0f9ff">
      八百里洞庭湖 —— 长江之巨浸 · 调蓄两湖平原
    </text>
    <text x="364" y="44" text-anchor="middle" font-size="11.5" fill="#bae6fd">
      长江进入湖北荆江段，经藕池口/松滋口四口南流入洞庭；洞庭纳湘资沅澧四水，在岳阳城陵矶复归长江
    </text>
    <text x="364" y="60" text-anchor="middle" font-size="11" font-weight="bold" fill="#fde047">
      🌾 历史谚语：“湖广熟，天下足” —— 两湖水网与江汉平原成为明清全国粮仓！
    </text>
  </g>

  <!-- 底部典故考据与两湖双楼 -->
  <g transform="translate(36, 336)">
    <rect width="728" height="114" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    
    <text x="18" y="24" font-size="13" font-weight="bold" fill="#0f172a">
      📜 历史典故与楚水文化渊源
    </text>

    <g transform="translate(18, 36)">
      <rect width="338" height="66" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-size="11.5" font-weight="bold" fill="#0369a1">古“云梦泽”与沧海桑田</text>
      <text x="12" y="36" font-size="10.5" fill="#64748b">先秦时江汉平原覆盖着数十万公顷的古云梦泽。随泥沙淤积，泽国逐渐演变为今天的江汉平原与洞庭湖，孕育出富庶的鱼米之乡。</text>
    </g>

    <g transform="translate(372, 36)">
      <rect width="338" height="66" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-size="11.5" font-weight="bold" fill="#b45309">明代“湖广行省”到清代分省</text>
      <text x="12" y="36" font-size="10.5" fill="#64748b">元明时期两湖同为“湖广等处行中书省”。清初康熙年间以洞庭湖为天堑划界，北为湖北、南为湖南，“湖广”这一古称依然流传至今。</text>
    </g>
  </g>
</svg>
